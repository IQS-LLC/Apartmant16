[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisor/supervisord.pid
childlogdir=/var/log/supervisor/

[program:postgresql]
command=/usr/bin/pg_ctlcluster 14 main start --foreground
user=postgres
autostart=true
autorestart=true
startretries=3
redirect_stderr=true
stdout_logfile=/var/log/supervisor/postgresql.log

[program:init_db]
command=/bin/bash -c "sleep 5 && sudo -u postgres psql -c \"CREATE DATABASE IF NOT EXISTS plc_db;\" && sudo -u postgres psql -c \"CREATE USER IF NOT EXISTS plc_user WITH PASSWORD 'plc_password';\" && sudo -u postgres psql -c \"GRANT ALL PRIVILEGES ON DATABASE plc_db TO plc_user;\" && sudo -u postgres psql -c \"ALTER USER plc_user CREATEDB;\""
user=root
autostart=true
autorestart=false
startretries=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/init_db.log
depends_on=postgresql

[program:django_migrate]
command=/app/venv/bin/python manage.py migrate
directory=/app
user=app
autostart=true
autorestart=false
startretries=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/django_migrate.log
depends_on=init_db

[program:django_collectstatic]
command=/app/venv/bin/python manage.py collectstatic --noinput
directory=/app
user=app
autostart=true
autorestart=false
startretries=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/django_collectstatic.log

[program:gunicorn]
command=/app/venv/bin/gunicorn --config gunicorn.conf.py PLC_Project.wsgi:application
directory=/app
user=app
autostart=true
autorestart=true
startretries=3
redirect_stderr=true
stdout_logfile=/var/log/supervisor/gunicorn.log
depends_on=django_migrate,django_collectstatic

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
startretries=3
redirect_stderr=true
stdout_logfile=/var/log/supervisor/nginx.log
depends_on=gunicorn